services:
  # ============================================================================
  # 1. BACKEND: Python Django REST Framework Web Service (Free Tier)
  # ============================================================================
  - type: web
    name: ticket-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: cd backend && chmod +x build.sh && ./build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # ============================================================================
  # 2. FRONTEND: React + Vite Single Page Application Static Site (Free Tier)
  # ============================================================================
  - type: web
    name: ticket-frontend
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      # Single-page application fallback route for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ticket-backend
          envVarKey: RENDER_EXTERNAL_URL
